services:
  streamlt:
    build: .
    ports:
      - "3000:3000"
    environment:
      VIDEO_LIBRARY_PATH: /media/videos
      VIDEO_CACHE_PATH: /app/data/cache
    volumes:
      - ${VIDEO_LIBRARY_HOST_PATH:?Set VIDEO_LIBRARY_HOST_PATH in .env}:/media/videos
      - streamlt-cache:/app/data/cache
    restart: unless-stopped

volumes:
  streamlt-cache:
